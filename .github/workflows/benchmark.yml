name: Public corpus development benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -c requirements.lock '.[semantic]'
      - run: python scripts/fetch_corpus.py
      - run: docatlas ingest data/corpus --manifest data/corpus-sources.json
        env:
          DOCATLAS_EMBEDDINGS: fastembed
      - run: docatlas eval evals/fastapi-development.jsonl --modes bm25 dense hybrid --output data/report.json --baseline evals/development-results.json
        env:
          DOCATLAS_EMBEDDINGS: fastembed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-development-report
          path: |
            data/report.json
            data/report.md
